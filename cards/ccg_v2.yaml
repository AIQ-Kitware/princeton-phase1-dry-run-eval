# ccg_v2: contextual drag in GPT-OSS-20B on competition mathematics.
#
# GPT-OSS-20B answers each problem with K = 4 of its own earlier drafts in its context, T of them
# correct. The card fits
#   logit p(T) = c + w log((T + 1/2) / (K - T + 1/2))
# to its accuracy at T = 0, 1, 2 and tests whether it predicts the accuracy at T = 3 and T = 4
# within 5 percentage points. The measurements (AIME and HMMT 2024-25) are in
# data/ccg_v2/ladders/GPT_OSS_20B.json; the card needs no GPU and no model endpoint.

name: ccg_v2

title: "Contextual Drag — CCG v2 for GPT-OSS-20B: T = 0, 1, 2 predict T = 3, 4"

description: |
  GPT-OSS-20B answers a competition-mathematics problem (AIME and HMMT 2024-25) with K = 4 of its
  own earlier drafts in its context, T of them correct. Its accuracy is modelled as
  logit p(T) = c + w log((T + 1/2) / (K - T + 1/2)), where c is the log-odds of a correct answer
  when the drafts are tied two against two and w is how strongly the model follows its drafts.

  c and w are fitted to the model's accuracy at T = 0, 1, 2, and the law predicts its accuracy at
  T = 3 and T = 4. The claim is that both predictions are within 5 percentage points of the
  measured accuracy. The measurements are included with the card.

version: 2.0

organizations:
  - Princeton

submitter:
  name: Yun Cheng
  email: yc6206@princeton.edu

tags:
  - contextual-drag
  - reasoning
  - in-context-learning
  - self-improvement
  - prediction
  - competition-math

links:
  - title: "Cheng, Zhu, Zhao and Arora. Contextual Drag: How Errors in the Context Affect LLM Reasoning. arXiv:2602.04288 (2026)"
    url: "https://arxiv.org/abs/2602.04288"
    type: "publication"
  - title: "contextual_drag implementation"
    url: "https://github.com/Princeton-TA1-Team/phase1-dry-run-eval"
    type: "software"
  - title: "AIME 2024"
    url: "https://huggingface.co/datasets/HuggingFaceH4/aime_2024"
    type: "dataset"
  - title: "AIME 2025"
    url: "https://huggingface.co/datasets/opencompass/AIME2025"
    type: "dataset"
  - title: "HMMT February 2024 and 2025"
    url: "https://huggingface.co/datasets/MathArena/hmmt_feb_2025"
    type: "dataset"

category: "Predictive Generalization"

# Every link is read from cards/nodes/cd_ccg_v2.py with `ast`; nothing is imported.
theory:
  indexes:
    - ../theory/indexes/ccg_v2.yaml
    - ../theory/indexes/hygiene.yaml

  empirical_sources:
    - nodes/cd_ccg_v2.py

  links:
    - relation: tests
      ref: AIQ.Teams.Princeton.CCGv2.lower_half_predicts_upper
      note: >
        The claim below is this conjecture's pass criterion for the six bundled models.
    - relation: approximates
      ref: AIQ.Teams.Princeton.CCGv2.law
      note: >
        The fitted law, by weighted least squares on the log-odds of the calibration rungs.
    - relation: motivates
      ref: AIQ.Teams.Princeton.CCGv2.symmetry_and_sensitivity
      note: >
        The mirror symmetry is why the lower half predicts the upper; the compression bound is why
        calibrating on the lower, unsaturated rungs is the stable direction. Proved on paper and
        checked numerically, not formalized.

claim:
  python: |
    # Read by name rather than bulk-dumped, so the verdict records exactly the leaves it consumed.
    result = metrics.ccg_v2
    status = result.status
    detail = result.detail

    # Not an assert: MAGNET maps AssertionError to FALSIFIED and anything else to INCONCLUSIVE.
    if status == 'INCONCLUSIVE':
        raise RuntimeError(f"Inconclusive: {detail}")

    models = sorted({key.split('.')[0] for key in result.per_model.keys()})
    if len(models) != n_targets_expected:
        raise RuntimeError(
            f"Inconclusive: {len(models)} models scored, the card declares {n_targets_expected}")

    passing, report = [], []
    for model in models:
        fold = result.per_model[model]
        errors = [fold['err_pp']['3'], fold['err_pp']['4']]
        if all(abs(e) <= tolerance_pp for e in errors):
            passing.append(model)
        report.append(f"{model}: T3 {errors[0]:+.2f}, T4 {errors[1]:+.2f} pp "
                      f"(c {fold['c']:.2f}, w {fold['w']:.2f})")
    print('[ccg_v2] ' + '; '.join(report))
    print(f'[ccg_v2] {len(passing)}/{len(models)} models within {tolerance_pp} pp '
          f'at T = 3 and T = 4: {passing}')

    assert len(passing) >= min_models_pass, (
        f"{len(passing)} of {len(models)} models have both predictions within {tolerance_pp} "
        f"points; the claim needs {min_models_pass}. " + '; '.join(report))

symbols:
  tolerance_pp:
    type: float
    value: 5.0
  min_models_pass:
    type: int
    value: 1
  n_targets_expected:
    type: int
    value: 1

  ccg_v2.mae_pp:
    metadata:
      display_name: "Mean |error|, T = 3 and 4 (pp)"
      display: True
      define_metric:
        objective: minimize
        aggregation_strategy:
          type: 'mean'
  ccg_v2.max_abs_err_pp:
    metadata:
      display_name: "Largest |error| (pp)"
      display: True
  ccg_v2.n_models_pass:
    metadata:
      display_name: "Models within 5 pp at T = 3 and 4"
      display: True
  ccg_v2.line_mae_pp:
    metadata:
      display_name: "Mean |error| of straight-line extrapolation, no law (pp)"
      display: True
  ccg_v2.n_models_supported:
    metadata:
      display_name: "Models whose 95% intervals lie within 5 pp"
      display: True

# Judge this invocation's run, not every result the shared store holds.
evidence:
  scope: requested

kwdagger:
  pipeline: 'cards.pipelines.ccg_v2_pipeline()'
  result_node: ccg_v2
  matrix:
    # The measurements scored; any directory of ladder files in the same format can be used.
    ccg_v2.ladders_dpath: 'data/ccg_v2/ladders'
    ccg_v2.ladders_glob: 'GPT_OSS_20B.json'
    ccg_v2.n_targets_expected: 1
    ccg_v2.calibration_rungs: '0,1,2'
    ccg_v2.predict_rungs: '3,4'
    ccg_v2.tolerance_pp: 5.0
    ccg_v2.min_models_pass: 1
    ccg_v2.n_boot: 2000
    ccg_v2.boot_seed: 20261111
    ccg_v2.confidence: 0.95
