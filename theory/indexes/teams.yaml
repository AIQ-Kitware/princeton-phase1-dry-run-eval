# The formalization behind this repository's evaluation card.
#
# Every theorem here is PROVED -- there is no `sorry` in the Lean file this
# indexes, and it typechecks against Mathlib.
#
# The statements are small on purpose, and the content is in the HYPOTHESES
# rather than the conclusions: each is a modest true claim whose premises are
# the things the card does not check. That is what the formalization is for.
# The card's own assertion is an empirical matter and is not a theorem.

schema_version: 1
formalization:
  system: lean4
entries:
- id: AIQ.Teams.ContextualDrag.drag_eq_mean_diff
  kind: theorem
  declaration: AIQ.Teams.ContextualDrag.drag_eq_mean_diff
  source_path: theory/lean/ContextualDrag.lean
  statement: 'The drag equals the mean of the per-problem difference, because both accuracies
    are means over the same problem set. This is what makes the two accuracies comparable
    at all; measured over different problem sets the drag would be a difference of independent
    means and the pairing premise would be false. PROVED.

    '
- id: AIQ.Teams.ContextualDrag.unpaired_difference_of_no_effect
  kind: theorem
  declaration: AIQ.Teams.ContextualDrag.unpaired_difference_of_no_effect
  source_path: theory/lean/ContextualDrag.lean
  statement: 'An explicit witness showing that comparing two averages taken over DIFFERENT
    problem sets can report a nonzero difference when the per-problem effect is identically
    zero. PROVED. This is why the clean accuracy is restricted to the problems that survived
    the filter, and why the pairing identity above is load-bearing rather than pedantic.

    '
- id: AIQ.Teams.ContextualDrag.hoeffdingSize
  kind: definition
  declaration: AIQ.Teams.ContextualDrag.hoeffdingSize
  source_path: theory/lean/ContextualDrag.lean
  statement: 'The paired sample size for tolerance eps at confidence 1 - delta; about 738
    at eps = delta = 0.05. Defined as a quantity only -- the file states plainly that it is
    never connected to a confidence claim, because there is no probability space in it.

    '
