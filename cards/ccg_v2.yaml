# Contextual drag, CCG v2: does the CCG v2 law, fitted on a model's accuracy with
# zero, one and two correct drafts, predict its accuracy with three and four?
#
# Implements "Contextual Drag as a Log-Count Vote" (Team Princeton-2, November 11, 2026).
# The card generates nothing: its only node scores ladder files that already exist. By default
# these are the six competition-mathematics ladders bundled in data/ccg_v2/ladders (GPT-OSS-120B,
# GPT-OSS-20B, Gemma4-31B, Gemma4-E4B, Qwen3-32B, Qwen3-8B; AIME/HMMT 2024-25; measured before
# submission with the protocol of the version-1 card; see the PROVENANCE.md there). The ladders of
# any version-1 run can be scored instead by pointing ccg_v2.ladders_dpath at
# <OUTPUT_PATH>/_kwdagger/ladder and ccg_v2.ladders_glob at '*/ladder.json' (and setting
# n_targets_expected and min_models_pass to the number of models in that run).
#
# Law. With K = 4 drafts of which T are correct,
#   logit p(T) = c + w log((T + 1/2) / (K - T + 1/2)),
# with c and w fitted per model by weighted least squares on the log-odds of its accuracies at
# T = 0, 1, 2. No parameter comes from another model and no constant is tuned.
#
# Pre-registered (fixed before the run): the bundled ladders (sha256 in PROVENANCE.md), the law,
# the calibration rungs (0, 1, 2), the predicted rungs (3, 4), the 5-point tolerance, the pass rule
# (every scored model within tolerance at both rungs) and the bootstrap settings below.
#
# On the bundled ladders this procedure gives T = 3 / T = 4 errors of -3.1/-0.2 (GPT-OSS-120B),
# -3.6/-0.4 (GPT-OSS-20B), +0.2/+0.7 (Gemma4-31B), +0.7/+1.2 (Gemma4-E4B), -0.2/-1.7 (Qwen3-32B)
# and -3.2/-0.8 (Qwen3-8B): all six pass.

name: ccg_v2

title: "Contextual Drag — CCG v2: T = 0, 1, 2 predict T = 3, 4"

description: |
  Asking a model to improve on earlier attempts in its context is a building block of recursive
  self-improvement, but the attempts do more than inform: correct drafts pull the model toward the
  right answer and wrong drafts toward their errors (contextual drag). This card tests a law of
  that effect as a predictor of unmeasured mixtures of drafts.

  With K = 4 drafts of which T are correct, the law says the model's log-odds of answering
  correctly are c + w log((T + 1/2)/(K - T + 1/2)): the model's odds of a correct answer are e^c times
  the draft odds (T + 1/2)/(K - T + 1/2) to the power w (1/2 is the Jeffreys pseudo-count). c is the log-odds of a correct answer when the drafts are tied two
  against two; w is the model's sensitivity to the draft odds. The log ratio is antisymmetric about the
  tie, so in log-odds the upper half of a model's ladder mirrors the lower half.

  For each of six models on competition mathematics, c and w are fitted to the model's own
  accuracies with zero, one and two correct drafts, and the law predicts its accuracies with three
  and four. The claim is that every prediction is within 5 points of the measured accuracy. The
  card scores existing measurements only; it does not generate anything. Bootstrap intervals over
  problems are reported; at 18 to 30 problems per model they are wider than the tolerance, so the
  verdict rests on the point estimates. A straight-line extrapolation is reported as a no-law
  baseline.

